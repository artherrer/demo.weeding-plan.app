<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />

    <link rel="icon" type="image/png" href="%VITE_FAVICON%" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>%VITE_SITE_TITLE%</title>

    <meta
      name="description"
      content="%VITE_SITE_DESCRIPTION%"
    />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="%VITE_SITE_URL%" />
    <meta property="og:title" content="%VITE_SITE_TITLE%" />
    <meta
      property="og:description"
      content="%VITE_SITE_DESCRIPTION%"
    />
    <meta
      property="og:image"
      content="%VITE_OG_IMAGE%"
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="%VITE_OG_IMAGE_ALT%"
    />
    <meta
      property="og:locale"
      content="%VITE_OG_LOCALE%"
    />
    <meta
      property="og:site_name"
      content="%VITE_SITE_NAME%"
    />

    <!-- Twitter -->
    <meta
      name="twitter:card"
      content="summary_large_image"
    />
    <meta
      name="twitter:title"
      content="%VITE_SITE_TITLE%"
    />
    <meta
      name="twitter:description"
      content="%VITE_SITE_DESCRIPTION%"
    />
    <meta
      name="twitter:image"
      content="%VITE_OG_IMAGE%"
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600&family=Montserrat:wght@300;400&display=swap"
      rel="stylesheet"
    />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
